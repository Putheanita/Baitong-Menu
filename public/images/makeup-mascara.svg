<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLight" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FAF8F8"/>
      <stop offset="100%" stop-color="#ECE5E5"/>
    </radialGradient>

    <!-- Sleek Rose Gold Tube -->
    <linearGradient id="roseTube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A1C24"/>
      <stop offset="20%" stop-color="#B26372"/>
      <stop offset="45%" stop-color="#F2BAC3"/>
      <stop offset="70%" stop-color="#9C4B5B"/>
      <stop offset="100%" stop-color="#3A1C24"/>
    </linearGradient>

    <!-- Glossy Wand Silver -->
    <linearGradient id="silverWand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="40%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2D1118" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgLight)"/>

  <!-- Pedestal Shadow -->
  <ellipse cx="250" cy="425" rx="140" ry="20" fill="#000000" opacity="0.09" filter="blur(7px)"/>

  <!-- Mascara Tube (Standing on left) -->
  <g filter="url(#softShadow)" transform="translate(180, 80)">
    <rect x="0" y="0" width="46" height="320" rx="14" fill="url(#roseTube)"/>
    <rect x="8" y="6" width="6" height="308" rx="3" fill="#FFFFFF" opacity="0.45"/>
    <!-- Typography Vertical -->
    <g transform="translate(28, 230) rotate(-90)">
      <text x="0" y="0" font-family="'Playfair Display', serif" font-size="10" font-weight="700" fill="#FFFFFF" letter-spacing="3">LASH LIFT</text>
      <text x="0" y="10" font-family="'Outfit', sans-serif" font-size="6.5" font-weight="600" fill="#FCE7EB" letter-spacing="1.5">WATERPROOF CURL</text>
    </g>
  </g>

  <!-- Mascara Wand (Tilted on right) -->
  <g filter="url(#softShadow)" transform="translate(270, 70) rotate(16)">
    <!-- Handle -->
    <rect x="0" y="0" width="38" height="150" rx="12" fill="url(#roseTube)"/>
    <rect x="6" y="4" width="5" height="142" rx="2.5" fill="#FFFFFF" opacity="0.45"/>
    
    <!-- Metal Stem -->
    <rect x="14" y="150" width="10" height="85" fill="url(#silverWand)"/>
    
    <!-- Curved Silicone Brush Bristles -->
    <path d="M 12,235 C 10,265 10,295 19,325 C 24,295 24,265 22,235 Z" fill="#18181B"/>
    <!-- Individual Micro Bristles Texture -->
    <g stroke="#18181B" stroke-width="1.8" stroke-linecap="round">
      <line x1="6" y1="245" x2="26" y2="245"/>
      <line x1="4" y1="255" x2="28" y2="255"/>
      <line x1="3" y1="265" x2="29" y2="265"/>
      <line x1="4" y1="275" x2="28" y2="275"/>
      <line x1="6" y1="285" x2="27" y2="285"/>
      <line x1="8" y1="295" x2="26" y2="295"/>
      <line x1="11" y1="305" x2="25" y2="305"/>
      <line x1="14" y1="315" x2="23" y2="315"/>
    </g>
  </g>

  <!-- Tag -->
  <g transform="translate(42, 42)">
    <rect width="115" height="26" rx="13" fill="#6B2135"/>
    <text x="57" y="17" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">👁️ MASCARA</text>
  </g>
</svg>
