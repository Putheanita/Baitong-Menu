<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLight" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFF9F9"/>
      <stop offset="100%" stop-color="#F3E9E9"/>
    </radialGradient>

    <!-- Metallic Cap -->
    <linearGradient id="roseGoldCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2A69A"/>
      <stop offset="25%" stop-color="#FCDAD3"/>
      <stop offset="60%" stop-color="#D99082"/>
      <stop offset="100%" stop-color="#BA7163"/>
    </linearGradient>

    <!-- Glass Bottle Gradient -->
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="15%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="85%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.85)"/>
    </linearGradient>

    <!-- Juicy Tint Liquid -->
    <linearGradient id="tintLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E14B68"/>
      <stop offset="40%" stop-color="#D0264B"/>
      <stop offset="80%" stop-color="#A51536"/>
      <stop offset="100%" stop-color="#7C0822"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#802137" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgLight)"/>

  <!-- Pedestal Shadow -->
  <ellipse cx="250" cy="425" rx="130" ry="20" fill="#000000" opacity="0.09" filter="blur(7px)"/>

  <!-- Lip Tint Bottle Group -->
  <g filter="url(#softShadow)" transform="translate(195, 80)">
    
    <!-- Metallic Cap -->
    <rect x="15" y="0" width="80" height="110" rx="8" fill="url(#roseGoldCap)"/>
    <!-- Cap Sheen Highlight -->
    <rect x="25" y="4" width="8" height="102" rx="4" fill="#FFFFFF" opacity="0.45"/>

    <!-- Clear Neck Ring -->
    <rect x="20" y="110" width="70" height="10" fill="#E8D1CB"/>

    <!-- Glass Outer Bottle -->
    <rect x="10" y="120" width="90" height="210" rx="16" fill="url(#glassBody)" stroke="#EAD5D0" stroke-width="2"/>

    <!-- Inner Reservoir (Juicy Tint) -->
    <rect x="18" y="130" width="74" height="190" rx="10" fill="url(#tintLiquid)"/>

    <!-- Glossy Reflection on Liquid -->
    <path d="M 24,138 L 40,138 L 28,310 L 22,310 Z" fill="#FFFFFF" opacity="0.35"/>
    <ellipse cx="55" cy="310" rx="28" ry="6" fill="#80061E" opacity="0.6"/>

    <!-- Bottle Front Typography -->
    <text x="55" y="215" font-family="'Playfair Display', serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">PETAL GLAZE</text>
    <text x="55" y="230" font-family="'Outfit', sans-serif" font-size="7.5" font-weight="600" fill="#FFE2E7" text-anchor="middle" letter-spacing="1.5">DEWY LIP TINT</text>
    <text x="55" y="245" font-family="'Outfit', sans-serif" font-size="6.5" font-weight="500" fill="#FFC9D3" text-anchor="middle" letter-spacing="1">ROSE FIG • 04</text>
    
    <!-- Bottom Glass Thickness -->
    <rect x="10" y="320" width="90" height="14" rx="6" fill="rgba(255,255,255,0.7)"/>
  </g>

  <!-- Luscious Tint Swatch Drop on Base -->
  <g transform="translate(325, 340)">
    <ellipse cx="30" cy="40" rx="48" ry="18" fill="url(#tintLiquid)" opacity="0.85" transform="rotate(-15)"/>
    <ellipse cx="25" cy="36" rx="20" ry="5" fill="#FFFFFF" opacity="0.4" transform="rotate(-15)"/>
  </g>

  <!-- Tag -->
  <g transform="translate(42, 42)">
    <rect width="105" height="26" rx="13" fill="#B32446"/>
    <text x="52" y="17" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">💄 LIP TINT</text>
  </g>
</svg>
