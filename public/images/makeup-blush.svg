<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLight" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFFBF7"/>
      <stop offset="100%" stop-color="#F2EBE4"/>
    </radialGradient>

    <!-- Peach Blush Powder Gradient -->
    <radialGradient id="blushPowder" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFB3A1"/>
      <stop offset="45%" stop-color="#F4937D"/>
      <stop offset="85%" stop-color="#DE745D"/>
      <stop offset="100%" stop-color="#C25A45"/>
    </radialGradient>

    <!-- Acrylic Compact Clear Frame -->
    <linearGradient id="acrylicLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="25%" stop-color="rgba(240,240,245,0.6)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(230,230,235,0.85)"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#803D2E" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgLight)"/>

  <!-- Pedestal Shadow -->
  <ellipse cx="250" cy="415" rx="150" ry="24" fill="#000000" opacity="0.08" filter="blur(8px)"/>

  <!-- Compact Group -->
  <g filter="url(#softShadow)" transform="translate(130, 110)">
    
    <!-- Outer Acrylic Casing -->
    <rect x="0" y="0" width="240" height="240" rx="36" fill="url(#acrylicLid)" stroke="#E5D9D2" stroke-width="2.5"/>

    <!-- Inner Well Rim -->
    <rect x="25" y="25" width="190" height="190" rx="26" fill="#FDFBF9" stroke="#E3D0C6" stroke-width="1.5"/>

    <!-- Pressed Powder Pan -->
    <rect x="32" y="32" width="176" height="176" rx="20" fill="url(#blushPowder)"/>

    <!-- Geometric Pressed Pattern / Relief Lines -->
    <g opacity="0.3" stroke="#FFFFFF" stroke-width="2" fill="none">
      <circle cx="120" cy="120" r="70"/>
      <circle cx="120" cy="120" r="50"/>
      <circle cx="120" cy="120" r="30"/>
      <line x1="50" y1="120" x2="190" y2="120"/>
      <line x1="120" y1="50" x2="120" y2="190"/>
    </g>

    <!-- Center Brand Typography Embossed -->
    <rect x="65" y="100" width="110" height="40" rx="8" fill="#FFFFFF" opacity="0.88"/>
    <text x="120" y="118" font-family="'Playfair Display', serif" font-size="9.5" font-weight="700" fill="#99412F" text-anchor="middle" letter-spacing="2">SOFT CLOUD</text>
    <text x="120" y="131" font-family="'Outfit', sans-serif" font-size="7" font-weight="600" fill="#AA5644" text-anchor="middle" letter-spacing="1">VELVET BLUSH</text>

    <!-- Acrylic Corner Glare / Highlight -->
    <path d="M 12,36 C 12,22 22,12 36,12 L 180,12 C 140,24 80,30 40,70 L 12,180 Z" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Powder Swatch Touch -->
  <g transform="translate(365, 335)">
    <ellipse cx="20" cy="20" rx="35" ry="14" fill="#FFB3A1" opacity="0.75" transform="rotate(-20)"/>
    <ellipse cx="16" cy="18" rx="22" ry="7" fill="#F4937D" opacity="0.6" transform="rotate(-20)"/>
  </g>

  <!-- Tag -->
  <g transform="translate(42, 42)">
    <rect width="95" height="26" rx="13" fill="#D25C44"/>
    <text x="47" y="17" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">🌸 BLUSH</text>
  </g>
</svg>
