<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background studio light -->
    <radialGradient id="bgLight" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F7F9F8"/>
      <stop offset="100%" stop-color="#E9ECE9"/>
    </radialGradient>

    <!-- Cushion Case Metallic Rim -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6D3BA"/>
      <stop offset="35%" stop-color="#FDF6EB"/>
      <stop offset="70%" stop-color="#D4B68F"/>
      <stop offset="100%" stop-color="#B89467"/>
    </linearGradient>

    <!-- Compact Case Base -->
    <linearGradient id="caseGreen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E8EFEA"/>
      <stop offset="85%" stop-color="#CBDCD0"/>
      <stop offset="100%" stop-color="#ABC3B2"/>
    </linearGradient>

    <!-- Sponge Mesh Texture -->
    <radialGradient id="spongeBeige" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF2E2"/>
      <stop offset="40%" stop-color="#F6DEC4"/>
      <stop offset="80%" stop-color="#E7C2A1"/>
      <stop offset="100%" stop-color="#D1A783"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1E3024" flood-opacity="0.14"/>
    </filter>
    
    <filter id="puffShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="500" height="500" fill="url(#bgLight)"/>

  <!-- Pedestal Shadow -->
  <ellipse cx="250" cy="410" rx="170" ry="26" fill="#000000" opacity="0.08" filter="blur(8px)"/>

  <!-- Compact Base Shadow & Body -->
  <g filter="url(#softShadow)">
    <!-- Outer Gold Ring -->
    <circle cx="250" cy="250" r="156" fill="url(#goldRim)"/>
    <!-- Outer Case Sage Body -->
    <circle cx="250" cy="250" r="150" fill="url(#caseGreen)"/>
    <!-- Inner Gold Inset -->
    <circle cx="250" cy="250" r="124" fill="url(#goldRim)"/>
    <!-- Inner Well -->
    <circle cx="250" cy="250" r="120" fill="#FFFFFF"/>
    <!-- Cushion Sponge Mesh -->
    <circle cx="250" cy="250" r="114" fill="url(#spongeBeige)"/>
  </g>

  <!-- Sponge Pores Texture Simulation -->
  <g opacity="0.25">
    <circle cx="220" cy="220" r="3" fill="#A87F5C"/>
    <circle cx="250" cy="210" r="2.5" fill="#A87F5C"/>
    <circle cx="280" cy="230" r="3" fill="#A87F5C"/>
    <circle cx="210" cy="260" r="2" fill="#A87F5C"/>
    <circle cx="240" cy="250" r="3.5" fill="#A87F5C"/>
    <circle cx="270" cy="270" r="2.5" fill="#A87F5C"/>
    <circle cx="290" cy="250" r="3" fill="#A87F5C"/>
    <circle cx="230" cy="290" r="2" fill="#A87F5C"/>
    <circle cx="260" cy="295" r="3" fill="#A87F5C"/>
    <circle cx="190" cy="235" r="2" fill="#A87F5C"/>
    <circle cx="310" cy="265" r="2.5" fill="#A87F5C"/>
  </g>

  <!-- Cushion Center Emboss -->
  <text x="250" y="245" font-family="'Playfair Display', serif" font-size="13" font-weight="700" fill="#9C7654" text-anchor="middle" letter-spacing="3" opacity="0.75">CENTELLA</text>
  <text x="250" y="260" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="600" fill="#9C7654" text-anchor="middle" letter-spacing="2" opacity="0.7">GLOW CUSHION</text>
  <text x="250" y="272" font-family="'Outfit', sans-serif" font-size="7" font-weight="600" fill="#9C7654" text-anchor="middle" letter-spacing="1" opacity="0.6">SPF50+ PA++++</text>

  <!-- Teardrop Cushion Rubycell Puff (Resting on side) -->
  <g transform="translate(300, 260) rotate(-22)" filter="url(#puffShadow)">
    <!-- Puff Base -->
    <path d="M 0,-60 C 45,-60 65,-10 65,40 C 65,80 35,95 0,95 C -35,95 -65,80 -65,40 C -65,-10 -45,-60 0,-60 Z" fill="#2F4F3E"/>
    <!-- Puff Highlight Curve -->
    <path d="M 0,-56 C 40,-56 58,-10 58,38 C 58,74 30,88 0,88 C -30,88 -58,74 -58,38 C -58,-10 -40,-56 0,-56 Z" fill="#3D6450"/>
    <!-- Ribbon Band Across Puff -->
    <rect x="-62" y="10" width="124" height="24" rx="4" fill="#FFFFFF"/>
    <!-- Band Branding -->
    <text x="0" y="26" font-family="'Outfit', sans-serif" font-size="8" font-weight="800" fill="#2F4F3E" text-anchor="middle" letter-spacing="2">SKINCARE CO.</text>
  </g>

  <!-- Luxury Badge Top Left -->
  <g transform="translate(42, 42)">
    <rect width="105" height="26" rx="13" fill="#2F4F3E"/>
    <text x="52" y="17" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">✨ MAKEUP</text>
  </g>
</svg>
